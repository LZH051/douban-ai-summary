{% extends "base.html" %}
{% block title %}免费注册｜光影智选{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><p class="eyebrow">创建账户</p><h1>建立你的电影收藏夹</h1><p>注册后可以在不同设备保存自己喜欢的电影。</p>{% if errors %}<div class="error-list">{% for error in errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>用户名<input name="username" value="{{ form.username if form else '' }}" minlength="2" maxlength="50" required></label><label>邮箱<input type="email" name="email" value="{{ form.email if form else '' }}" required></label><label>密码<input type="password" name="password" minlength="8" required></label><label>确认密码<input type="password" name="password_confirm" minlength="8" required></label><button class="button full" type="submit">创建账户</button></form><p class="auth-foot">已有账户？<a href="/login">直接登录</a></p></div></section>{% endblock %}
